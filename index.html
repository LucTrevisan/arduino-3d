<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino 3D — SENAI XR Lab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loading" role="status"></div>
    <div id="app">
      <header id="topbar">
        <h1 id="app-title"></h1>
        <div id="lesson-menu" class="lesson-menu"></div>
      </header>
      <div id="main">
        <main id="stage">
          <canvas id="scene" tabindex="0"></canvas>
          <div id="inputs" class="inputs" hidden></div>
        </main>
        <aside id="side" class="panel"></aside>
      </div>
      <section id="bottom">
        <div id="code-panel" class="panel">
          <div class="panel-head">
            <h2 id="code-title"></h2>
            <div id="toolbar" class="toolbar"></div>
          </div>
          <div id="editor" class="editor"></div>
        </div>
        <div id="serial-panel" class="panel"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
